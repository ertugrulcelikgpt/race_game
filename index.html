<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Kanit:wght@300;400;500;600&family=Space+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <title>Nagihan Keskin</title>
</head>
<body>
  <nav class="nav">
    <a href="index.html#about">About</a>
    <a href="experience.html">Experience</a>
    <a href="maps.html">Maps</a>
    <a href="contact.html">Contact</a>
  </nav>

  <header class="hero">
    <div class="hero-sticky">
      <h1 class="mega">Hi, I'm Nagihan</h1>
      <div id="avatar" class="avatar" tabindex="0" title="Click me to say hi!"></div>
      <div class="hero-bottom">
        <p id="tagline" class="tagline"></p>
        <div class="hero-ctas">
          <a class="btn btn-outline" href="maps.html">Let's see maps</a>
          <a class="btn btn-glow" href="contact.html">Contact me</a>
        </div>
      </div>
      <div class="scroll-cue" aria-hidden="true"></div>
    </div>
  </header>

  <section id="about" class="section">
    <div class="floaters" aria-hidden="true">
      <img class="float" src="assets/float/globe.svg" alt="" style="left:0;top:-60px">
      <img class="float" src="assets/float/drone.svg" alt="" style="right:0;top:-40px">
    </div>
    <h2 class="mega section-title" style="margin-top:120px">About me</h2>
    <p id="about-text" class="reveal-text"></p>
    <div class="center"><a class="btn btn-glow" href="contact.html">Contact me</a></div>
    <div class="floaters" aria-hidden="true" style="margin-top:80px">
      <img class="float" src="assets/float/compass.svg" alt="" style="left:0">
      <img class="float" src="assets/float/pin.svg" alt="" style="right:0">
    </div>
  </section>

  <section class="section" style="padding-top:200px">
    <h2 class="mega section-title">Journey</h2>
    <div id="experience" class="grid"></div>
  </section>

  <section class="section">
    <div class="grid">
      <div class="card in observe">
        <p class="eyebrow">Skills highlights</p>
        <div id="highlights" style="margin-top:14px"></div>
      </div>
      <div class="card in observe">
        <p class="eyebrow">Languages</p>
        <div id="languages" style="margin-top:18px"></div>
      </div>
      <div class="card in observe">
        <p class="eyebrow">Hobbies</p>
        <div id="hobbies" style="margin-top:14px"></div>
      </div>
    </div>
    <div class="center"><a class="btn btn-outline" href="experience.html">See all skills →</a></div>
  </section>

  <footer>© <span data-year></span> <span data-db="profile.firstName"></span> <span data-db="profile.lastName"></span> · Geomatics Engineering · Hacettepe University</footer>
  <script src="data/db.js"></script>
  <script src="js/avatar.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
